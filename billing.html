<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Krivian Bakery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="cart.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="index.html">Krivian</a>
      <div class="bar-right">
        <a class="pill light cart-pill" href="cart.html">Cart <span class="badge" data-cart-badge hidden>0</span></a>
        <button class="burger" type="button" data-menu-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="menu-overlay">
    <button class="close-x" type="button" data-menu-toggle aria-label="Close menu"></button>
    <nav aria-label="Main">
      <a href="index.html#order">Order cookies</a>
      <a href="index.html#cookies">Our cookies</a>
      <a href="index.html#faq">FAQ</a>
      <a href="cart.html">Cart</a>
    </nav>
  </div>

  <main class="page">
    <div class="wrap">
      <div class="page-title">
        <h1>Checkout</h1>
        <p>Review your order</p>
      </div>
      <div id="checkout"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-top">
        <a class="logo" href="index.html">Krivian</a>
        <nav class="footer-links" aria-label="Footer">
          <a href="index.html#order">Order online</a>
          <a href="index.html#cookies">Our cookies</a>
          <a href="cart.html">Cart</a>
        </nav>
      </div>
      <div class="footer-bottom"><span>© <span id="year"></span> Krivian Bakery</span></div>
    </div>
  </footer>

  <script>
    // Payment isn't connected yet. This page shows the order and the steps that are coming.
    function renderPage(n) {
      const el = document.getElementById('checkout');
      if (!n) {
        el.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">${emptyState()}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="page-grid">
          <div class="card">
            <h2>Payment</h2>
            <div class="notice"><span>🔒</span><div><b>Online payment is coming soon</b>We're setting up secure checkout. Your cart is saved until then.</div></div>
            <ol class="steps-list">
              <li><div><b>Contact details</b>Name, email and phone number</div></li>
              <li><div><b>Pickup or delivery</b>Choose how you get your cookies</div></li>
              <li><div><b>Payment</b>Pay securely by card</div></li>
            </ol>
          </div>
          <aside class="card summary">
            <h2>Order summary</h2>
            ${lineItem(n, { picker: false })}
            <div style="margin-top:20px">
              <div class="sum"><span>Subtotal</span><strong>${money(priceFor(n))}</strong></div>
              <div class="sum total"><span>Total</span><strong>${money(priceFor(n))}</strong></div>
            </div>
            <button class="pill solid full" disabled>Pay ${money(priceFor(n))}</button>
            <p class="secure">Payment isn't available yet</p>
            <a class="pill full" style="margin-top:14px" href="cart.html">Edit order</a>
          </aside>
        </div>`;
    }
  </script>
</body>
</html>
