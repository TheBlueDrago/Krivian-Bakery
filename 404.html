<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#752336">
  <title>Page not found · Krivian Bakery</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/cart.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="/index.html"><img src="/logo.svg" alt="" width="44" height="44">Krivian</a>
      <div class="bar-right">
        <a class="pill light cart-pill" href="/cart.html">Cart <span class="badge" data-cart-badge hidden>0</span></a>
        <button class="burger" type="button" data-menu-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="menu-overlay">
    <button class="close-x" type="button" data-menu-toggle aria-label="Close menu"></button>
    <nav aria-label="Main">
      <a href="/index.html#order">Order cookies</a>
      <a href="/index.html#cookies">Our cookies</a>
      <a href="/index.html#faq">FAQ</a>
      <a href="/cart.html">Cart</a>
    </nav>
  </div>

  <main class="page signin-page">
    <div class="signin-card">
      <img src="/logo.svg" alt="" width="88" height="88">
      <h1>Crumbs!</h1>
      <p>We couldn&rsquo;t find that page. The cookies are still here, though.</p>
      <a class="pill solid full" href="/#order">Order cookies</a>
      <a class="back" href="/">&larr; Back home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-top">
        <a class="logo" href="/index.html">Krivian</a>
        <nav class="footer-links" aria-label="Footer">
          <a href="/index.html#order">Order online</a>
          <a href="/index.html#cookies">Our cookies</a>
          <a href="/index.html#faq">FAQ</a>
          <a href="/legal.html">Privacy &amp; Terms</a>
        </nav>
      </div>
      <div class="footer-bottom"><span>© <span id="year"></span> Krivian Bakery</span></div>
    </div>
  </footer>

  <script>
    function renderPage(n) {
      const el = document.getElementById('cart-page');
      if (!n) {
        el.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">${emptyState()}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="page-grid">
          <div class="card">
            <h2>Your cookies</h2>
            ${lineItem(n, { picker: false })}
            <p class="sizes-label">Change pack size</p>
            ${sizePicker(n)}
            <p class="hint">Cookies come in packs of 4. Max 12 per order.</p>
            <p style="margin:22px 0 0"><button type="button" class="link" data-clear>Remove from cart</button></p>
          </div>
          <aside class="card summary">
            <h2>Summary</h2>
            <div class="sum"><span>${n} Chocolate Chip Cookies</span><strong>${money(priceFor(n))}</strong></div>
            <div class="sum total"><span>Total</span><strong>${money(priceFor(n))}</strong></div>
            <a class="pill solid full" href="/billing.html">Checkout</a>
            <a class="pill full" style="margin-top:10px" href="/index.html#order">Keep shopping</a>
          </aside>
        </div>`;
    }
  </script>
</body>
</html>
