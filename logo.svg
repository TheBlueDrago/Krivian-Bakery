<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Krivian Bakery">
  <defs>
    <radialGradient id="dough" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f2c27a"/>
      <stop offset=".55" stop-color="#d99a4e"/>
      <stop offset="1" stop-color="#b9762f"/>
    </radialGradient>
    <radialGradient id="badge" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffdfb"/>
      <stop offset="1" stop-color="#efe2d6"/>
    </radialGradient>
    <mask id="bite">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="94" cy="28" r="15" fill="#000"/>
      <circle cx="104" cy="44" r="11" fill="#000"/>
      <circle cx="80" cy="18" r="10" fill="#000"/>
    </mask>
  </defs>
  <!-- cream badge with a wine ring -->
  <circle cx="60" cy="60" r="58" fill="url(#badge)"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#752336" stroke-width="3"/>
  <!-- the cookie, with a bite out of it -->
  <g mask="url(#bite)">
    <path d="M60 18c9 0 13 4 20 6 8 3 14 9 17 17 3 7 6 11 5 19 0 9-4 14-7 21-4 8-10 13-18 16-7 3-11 5-18 4-8 0-13-3-20-6-8-4-13-10-16-18-3-7-5-11-4-19 1-8 4-13 8-20 5-8 11-12 19-15 5-3 8-5 14-5z" fill="url(#dough)"/>
    <!-- baked cracks -->
    <path d="M38 52c6 2 9-3 14-1M64 80c4-4 9-2 12-6M46 74c3 3 7 2 9 5M70 44c3 3 8 2 10 5" fill="none" stroke="#a8682a" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <!-- chocolate chunks -->
    <g fill="#3b1f14">
      <path d="M44 36l9-2 3 8-8 4-6-4z"/>
      <path d="M66 54l10-1 2 9-9 3-5-6z"/>
      <path d="M36 62l8-1 2 8-7 3-5-5z"/>
      <path d="M54 66l7-3 5 6-6 6-7-3z"/>
      <path d="M74 74l8 0 1 7-7 3-4-5z"/>
      <path d="M58 30l6 0 1 6-6 2-3-4z"/>
      <path d="M48 84l7-1 2 6-6 3-4-4z"/>
    </g>
    <g fill="#6b3a24" opacity=".7">
      <path d="M46 37l4-1 1 3-3 1z"/>
      <path d="M68 56l4-1 1 3-3 1z"/>
    </g>
    <!-- a little light on top -->
    <ellipse cx="46" cy="44" rx="14" ry="8" fill="#fff" opacity=".18" transform="rotate(-25 46 44)"/>
  </g>
  <!-- crumbs from the bite -->
  <circle cx="100" cy="62" r="2.2" fill="#c9883f"/>
  <circle cx="95" cy="68" r="1.5" fill="#c9883f"/>
</svg>
