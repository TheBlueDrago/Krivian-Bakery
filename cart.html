<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart · Krivian Bakery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="cart.js"></script>
</head>
<body>
  <header class="site-header over-hero scrolled">
    <div class="wrap">
      <a class="brand" href="index.html"><b>Krivian</b><small>Bakery</small></a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html#menu">Menu</a>
        <a href="index.html#how">How it works</a>
        <a href="index.html#story">Our story</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="nav-right">
        <a class="cart-btn" href="cart.html">
          <span class="cart-word">Cart</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="badge" data-cart-badge hidden>0</span>
        </a>
        <button class="icon-btn menu-toggle" type="button" data-menu-toggle aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <div class="page-banner">
    <img src="https://images.unsplash.com/photo-1584369372650-359b4003e743?auto=format&fit=crop&w=2000&q=70" alt="">
    <div class="wrap">
      <span class="eyebrow">Your order</span>
      <h1>Cart</h1>
    </div>
  </div>

  <main class="page">
    <div class="wrap" id="cart-page"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom"><span>© <span id="year"></span> Krivian Bakery</span><a href="index.html">Back to the menu</a></div>
    </div>
  </footer>

  <script>
    function renderPage(n) {
      const el = document.getElementById('cart-page');
      if (!n) {
        el.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">${emptyState()}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="page-grid">
          <div class="card">
            <h2>Your cookies</h2>
            ${lineItem(n, { picker: false })}
            <p class="sizes-label">Change pack size</p>
            ${sizePicker(n)}
            <p class="hint">Cookies come in packs of 4. Max 12 per order.</p>
            <p style="margin:22px 0 0"><button type="button" class="link" data-clear>Remove from cart</button></p>
          </div>
          <aside class="card summary">
            <h2>Summary</h2>
            <div class="sum"><span>${n} Chocolate Chip Cookies</span><strong>${money(priceFor(n))}</strong></div>
            <div class="sum total"><span>Total</span><strong>${money(priceFor(n))}</strong></div>
            <a class="btn full" href="billing.html">Go to checkout</a>
            <a class="btn ghost full" style="margin-top:10px" href="index.html#menu">Keep browsing</a>
          </aside>
        </div>`;
    }
  </script>
</body>
</html>
